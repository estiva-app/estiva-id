name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estiva
          POSTGRES_PASSWORD: estiva
          POSTGRES_DB: estiva_id
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U estiva -d estiva_id"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://estiva:estiva@localhost:5433/estiva_id
      ISSUER_URL: http://localhost:8787
      RP_ID: localhost
      RP_ORIGINS: http://localhost:8787
      # Quoted, and containing hex letters: an all-digit value is parsed by YAML
      # as a number and arrives as "1.1111111111e+63". Fake key, protects nothing.
      KEY_ENCRYPTION_KEK: 'ceff11ceff11ceff11ceff11ceff11ceff11ceff11ceff11ceff11ceff11ceff'
      KEY_ENCRYPTION_KID: ci-1
      SIGN_NIP98_ALLOWED_URL_PREFIXES: http://relay.test/

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      # `pnpm build` compiles the service; `pnpm typecheck` also covers the
      # tests and the UI, which the build deliberately excludes.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build service
        run: pnpm build

      # Before the tests, not after: the UI is only mounted when a build exists,
      # so without this the tests would exercise the API-only shape and the
      # SPA fallback would go unchecked.
      - name: Build UI
        run: pnpm build:web

      - name: Run migrations
        run: pnpm migrate

      - name: Test
        run: pnpm test

  # Publish only from main, and only once `check` has passed — an image that
  # failed its tests must never be pullable by the box, because the box pulls
  # whatever is tagged `main` without asking questions.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `main` is what the box tracks; the sha tag is what makes a rollback
          # possible without rebuilding.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
