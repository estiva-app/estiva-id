# Local development only. Production compose lives in deploy/.
#
# The project name is explicit because the production file also declares one
# (`estiva-id`), and compose derives an unnamed project from its directory —
# which is also `estiva-id`. Running the production stack locally to test it
# would otherwise recreate this stack's containers underneath you, which is a
# confusing five minutes.
name: estiva-id-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estiva
      POSTGRES_PASSWORD: estiva
      POSTGRES_DB: estiva_id
    ports:
      - '5433:5432'
    volumes:
      - estiva-id-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estiva -d estiva_id']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  estiva-id-pgdata:
