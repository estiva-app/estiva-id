# NOT CURRENTLY IN USE — kept for reference only.
#
# The `estiva-prod` tunnel is **dashboard-managed**: its service unit runs
# `cloudflared tunnel run --token-file /etc/cloudflared/token`, which means
# routing is configured at https://one.dash.cloudflare.com under
# Networks -> Tunnels -> estiva-prod -> Public Hostname.
#
# A config.yml on the server is IGNORED by a token-run tunnel. Writing one and
# restarting cloudflared changes nothing, which is a confusing half hour.
#
# This file is the equivalent configuration should the tunnel ever be converted
# to file-managed. Rules are evaluated in order and the catch-all must be last.

tunnel: estiva-prod
credentials-file: /etc/cloudflared/<tunnel-id>.json

ingress:
  # Estiva ID. Plain HTTP to loopback — Cloudflare terminates TLS at the edge,
  # so there is no certificate here and no ACME challenge to satisfy.
  - hostname: id.estiva.app
    service: http://localhost:8787

  # Our own workspace: the Buzz relay. Added when the relay lands (PEEK-59).
  #
  # Do NOT set httpHostHeader on this rule. Buzz resolves every request to a
  # community from the original Host header, and an unmapped host fails closed
  # with an empty response rather than an error — which is a genuinely horrible
  # thing to debug. Leave Host untouched.
  # - hostname: estiva.estiva.app
  #   service: http://localhost:3000

  # - hostname: peek.estiva.app
  #   service: http://localhost:5173

  # Marketing site — already configured.
  - hostname: estiva.app
    service: http://localhost:8080
  - hostname: www.estiva.app
    service: http://localhost:8080

  - service: http_status:404
